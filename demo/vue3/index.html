<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Vue 3 + monitor-report 演示</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 24px; background: #f8fafc; }
      .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 14px; max-width: 720px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
      button { padding: 7px 12px; margin-right: 8px; border: 1px solid #d1d5db; background: #fff; border-radius: 6px; cursor: pointer; }
      button.primary { background: #42b883; border-color: #42b883; color: #fff; }
      li { padding: 4px 0; }
      pre { background: #0b1220; color: #7dd3fc; padding: 12px; border-radius: 8px; font-size: 12px; min-height: 60px; white-space: pre-wrap; }
      .badge { display: inline-block; background: #ecfdf5; color: #047857; border-radius: 999px; padding: 2px 10px; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2 style="margin-top:0">Vue 3 任务清单 <span class="badge">appUse(vueErrorPlugin)</span></h2>
      <div id="app"></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">原 errorHandler 保留验证</h3>
      <p>Vue 组件抛错后，业务方原有的 <code>app.config.errorHandler</code> 被调用次数：<strong id="prev-count">0</strong>（每次点"抛错"应 +1）</p>
    </div>
    <div class="card">
      <h3 style="margin-top:0">SDK 控制</h3>
      <button id="btn-flush">立即上报</button>
      <button id="btn-status">刷新状态</button>
      <pre id="log"></pre>
    </div>

    <script src="/demo/vendor/vue.global.prod.js"></script>
    <script type="module">
      import { createMonitor } from '/dist/index.js'
      import { vueErrorPlugin } from '/dist/vue3.js'

      function log(text) {
        document.getElementById('log').textContent += text + '\n'
      }

      window.addEventListener('DOMContentLoaded', () => {
        const monitor = createMonitor({
          appId: 'vue3-demo-001',
          reportUrl: '/api/upload',
          env: 'test',
          modules: ['error', 'network'],
          release: 'vue3-app-1.0.0',
          debug: true,
          debounceTime: 1000,
          dedupWindow: 1000 // demo 演示用：调小去重窗口让上报更快可见；真实项目建议默认 5000
        })

        const { createApp, ref } = Vue
        const app = createApp({
          setup() {
            const tasks = ref(['写周报', '修 bug', '评审代码'])
            const reqLog = ref('')
            const addTask = () => tasks.value.push('新任务 ' + tasks.value.length)
            const throwSync = () => {
              // 组件事件 handler 中同步抛错 → 走 Vue errorHandler → vue_error 上报
              throw new Error('vue3 component sync error for task=' + tasks.value.length)
            }
            const throwAsync = () => {
              // 异步回调抛错不会被 Vue 捕获 → 走 window 全局错误通道 js_error（对照组）
              setTimeout(() => {
                throw new Error('vue3 async timer error')
              }, 0)
            }
            const fetchData = () => {
              fetch('/api/products')
                .then((r) => r.json())
                .then((res) => {
                  reqLog.value = '已请求商品接口，共 ' + res.data.length + ' 件商品（network 通道已采集）'
                })
                .catch(() => {})
            }
            return { tasks, reqLog, addTask, throwSync, throwAsync, fetchData }
          },
          template: `
            <ul>
              <li v-for="t in tasks" :key="t">{{ t }}</li>
            </ul>
            <p v-if="reqLog">{{ reqLog }}</p>
            <button class="primary" @click="addTask">新增任务</button>
            <button @click="throwSync">抛组件错误(vue_error)</button>
            <button @click="throwAsync">异步错误(js_error 对照)</button>
            <button @click="fetchData">请求商品接口</button>
          `
        })

        // 挂插件之前，业务方先注册自己的 errorHandler（用于验证"必须保留调用"）
        let prevCalls = 0
        app.config.errorHandler = (err, instance, info) => {
          prevCalls++
          document.getElementById('prev-count').textContent = String(prevCalls)
          log('[原 errorHandler] ' + err.message + ' info=' + info)
        }
        app.use(vueErrorPlugin, { monitor })
        app.mount('#app')
        log('Vue3 应用已挂载（app.use(vueErrorPlugin, { monitor })）')

        document.getElementById('btn-flush').addEventListener('click', () => {
          monitor.flushReport()
          log('已调用 flushReport')
        })
        document.getElementById('btn-status').addEventListener('click', () => {
          log('SDK 状态: ' + JSON.stringify(monitor.getStatus()))
        })
      })
    </script>
  </body>
</html>
