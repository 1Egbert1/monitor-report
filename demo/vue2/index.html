<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Vue 2 + monitor-report 演示</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 24px; background: #f8fafc; }
      .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 14px; max-width: 720px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
      button { padding: 7px 12px; margin-right: 8px; border: 1px solid #d1d5db; background: #fff; border-radius: 6px; cursor: pointer; }
      button.primary { background: #3f8f5f; border-color: #3f8f5f; color: #fff; }
      li { padding: 4px 0; }
      pre { background: #0b1220; color: #7dd3fc; padding: 12px; border-radius: 8px; font-size: 12px; min-height: 60px; white-space: pre-wrap; }
      .badge { display: inline-block; background: #ecfdf5; color: #047857; border-radius: 999px; padding: 2px 10px; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2 style="margin-top:0">Vue 2 记事本 <span class="badge">Vue.use(vueErrorPlugin)</span></h2>
      <div id="app"></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">原 errorHandler 保留验证</h3>
      <p>业务方原有的 <code>Vue.config.errorHandler</code> 被调用次数：<strong id="prev-count">0</strong>（每次点"抛错"应 +1）</p>
    </div>
    <div class="card">
      <h3 style="margin-top:0">SDK 控制</h3>
      <button id="btn-flush">立即上报</button>
      <button id="btn-status">刷新状态</button>
      <pre id="log"></pre>
    </div>

    <script src="/demo/vendor/vue2.min.js"></script>
    <script type="module">
      import { createMonitor } from '/dist/index.js'
      import { vueErrorPlugin } from '/dist/vue2.js'

      function log(text) {
        document.getElementById('log').textContent += text + '\n'
      }

      window.addEventListener('DOMContentLoaded', () => {
        const monitor = createMonitor({
          appId: 'vue2-demo-001',
          reportUrl: '/api/upload',
          env: 'test',
          modules: ['error', 'network'],
          release: 'vue2-app-2.7.16',
          debug: true,
          debounceTime: 1000,
          dedupWindow: 1000 // demo 演示用：调小去重窗口让上报更快可见；真实项目建议默认 5000
        })

        // 挂插件前先注册业务方原有 handler
        let prevCalls = 0
        Vue.config.errorHandler = (err, vm, info) => {
          prevCalls++
          document.getElementById('prev-count').textContent = String(prevCalls)
          log('[原 errorHandler] ' + (err && err.message ? err.message : String(err)) + ' info=' + info)
        }
        Vue.use(vueErrorPlugin, { monitor })

        new Vue({
          el: '#app',
          data: {
            notes: ['买菜', '取快递'],
            reqInfo: ''
          },
          methods: {
            addNote() {
              this.notes.push('便签 ' + (this.notes.length + 1))
            },
            throwSync() {
              throw new Error('vue2 component sync error for note=' + this.notes.length)
            },
            throwAsync() {
              setTimeout(() => {
                throw new Error('vue2 async timer error')
              }, 0)
            },
            fetchData() {
              const self = this
              fetch('/api/products')
                .then((r) => r.json())
                .then((res) => {
                  self.reqInfo = '已请求商品接口，共 ' + res.data.length + ' 件（network 通道已采集）'
                })
                .catch(() => {})
            }
          },
          // Vue 2 模板必须单一根节点，外层包 div，否则多个根会被丢弃
          template: `
            <div>
              <ul>
                <li v-for="n in notes" :key="n">{{ n }}</li>
              </ul>
              <p v-if="reqInfo">{{ reqInfo }}</p>
              <button class="primary" @click="addNote">新增便签</button>
              <button @click="throwSync">抛组件错误(vue_error)</button>
              <button @click="throwAsync">异步错误(js_error 对照)</button>
              <button @click="fetchData">请求商品接口</button>
            </div>
          `
        })
        log('Vue2 应用已挂载（Vue.use(vueErrorPlugin, { monitor })）')

        document.getElementById('btn-flush').addEventListener('click', () => {
          monitor.flushReport()
          log('已调用 flushReport')
        })
        document.getElementById('btn-status').addEventListener('click', () => {
          log('SDK 状态: ' + JSON.stringify(monitor.getStatus()))
        })
      })
    </script>
  </body>
</html>
