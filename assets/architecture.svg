<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 660" width="100%">
  <title>monitor-report 数据流架构</title>
  <desc>三类采集入口汇入 normalize，经管道六步处理后进入队列与传输</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="660" fill="#1C1C1E"/>

  <text x="60" y="22" font-family="sans-serif" font-size="12" fill="#A9A7A0">采集层：三种入口，各自负责一类数据</text>

  <rect x="50" y="36" width="180" height="58" rx="8" fill="#232A38" stroke="#4E82B8" stroke-width="1"/>
  <text x="140" y="57" font-family="monospace" font-size="12" fill="#B8D4F0" text-anchor="middle" dominant-baseline="central">error</text>
  <text x="140" y="75" font-family="sans-serif" font-size="11" fill="#7FA8CC" text-anchor="middle" dominant-baseline="central">onerror / unhandledrejection</text>

  <rect x="250" y="36" width="180" height="58" rx="8" fill="#232A38" stroke="#4E82B8" stroke-width="1"/>
  <text x="340" y="57" font-family="monospace" font-size="12" fill="#B8D4F0" text-anchor="middle" dominant-baseline="central">network</text>
  <text x="340" y="75" font-family="sans-serif" font-size="11" fill="#7FA8CC" text-anchor="middle" dominant-baseline="central">fetch / XHR 替换</text>

  <rect x="450" y="36" width="180" height="58" rx="8" fill="#232A38" stroke="#4E82B8" stroke-width="1"/>
  <text x="540" y="57" font-family="monospace" font-size="12" fill="#B8D4F0" text-anchor="middle" dominant-baseline="central">performance</text>
  <text x="540" y="75" font-family="sans-serif" font-size="11" fill="#7FA8CC" text-anchor="middle" dominant-baseline="central">PerformanceObserver ×6</text>

  <path d="M140 94 L140 118 L340 118" fill="none" stroke="#4E82B8" stroke-width="1.5"/>
  <path d="M340 94 L340 118" fill="none" stroke="#4E82B8" stroke-width="1.5"/>
  <path d="M540 94 L540 118 L340 118" fill="none" stroke="#4E82B8" stroke-width="1.5"/>
  <line x1="340" y1="118" x2="340" y2="136" stroke="#4E82B8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="50" y="140" width="580" height="42" rx="8" fill="#282542" stroke="#7F77DD" stroke-width="1"/>
  <text x="340" y="156" font-family="monospace" font-size="12" fill="#C9C3F2" text-anchor="middle" dominant-baseline="central">modules/*/normalize.ts</text>
  <text x="340" y="172" font-family="sans-serif" font-size="11" fill="#9C93E8" text-anchor="middle" dominant-baseline="central">各自标准化为 LogData（含指纹 / 去重键）</text>

  <line x1="340" y1="182" x2="340" y2="200" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="193" font-family="sans-serif" font-size="11" fill="#A9A7A0">emitter.emit(type, data)</text>

  <rect x="50" y="204" width="580" height="170" rx="12" fill="none" stroke="#7F77DD" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="70" y="224" font-family="monospace" font-size="12" fill="#C9C3F2">core/pipeline.ts</text>
  <text x="70" y="240" font-family="sans-serif" font-size="11" fill="#9C93E8">处理顺序固定，不得调整</text>

  <rect x="70" y="252" width="128" height="34" rx="6" fill="#282542" stroke="#7F77DD" stroke-width="1"/>
  <text x="134" y="269" font-family="sans-serif" font-size="11" fill="#C9C3F2" text-anchor="middle" dominant-baseline="central">① 校验</text>
  <rect x="206" y="252" width="128" height="34" rx="6" fill="#282542" stroke="#7F77DD" stroke-width="1"/>
  <text x="270" y="269" font-family="sans-serif" font-size="11" fill="#C9C3F2" text-anchor="middle" dominant-baseline="central">② 采样 sample</text>
  <rect x="342" y="252" width="128" height="34" rx="6" fill="#282542" stroke="#7F77DD" stroke-width="1"/>
  <text x="406" y="269" font-family="sans-serif" font-size="11" fill="#C9C3F2" text-anchor="middle" dominant-baseline="central">③ 去重 dedup</text>
  <rect x="70" y="294" width="128" height="34" rx="6" fill="#282542" stroke="#7F77DD" stroke-width="1"/>
  <text x="134" y="311" font-family="sans-serif" font-size="11" fill="#C9C3F2" text-anchor="middle" dominant-baseline="central">④ 脱敏 mask</text>
  <rect x="206" y="294" width="128" height="34" rx="6" fill="#282542" stroke="#7F77DD" stroke-width="1"/>
  <text x="270" y="311" font-family="sans-serif" font-size="11" fill="#C9C3F2" text-anchor="middle" dominant-baseline="central">⑤ 过滤 ignoreErrors</text>
  <rect x="342" y="294" width="128" height="34" rx="6" fill="#282542" stroke="#7F77DD" stroke-width="1"/>
  <text x="406" y="311" font-family="sans-serif" font-size="11" fill="#C9C3F2" text-anchor="middle" dominant-baseline="central">⑥ 计算 level</text>

  <rect x="500" y="252" width="120" height="76" rx="6" fill="#33201A" stroke="#C4642F" stroke-width="1"/>
  <text x="560" y="272" font-family="monospace" font-size="11" fill="#E8B392" text-anchor="middle" dominant-baseline="central">behaviors[type]</text>
  <text x="560" y="288" font-family="sans-serif" font-size="10" fill="#C4642F" text-anchor="middle" dominant-baseline="central">模块钩子</text>
  <text x="560" y="304" font-family="sans-serif" font-size="10" fill="#C4642F" text-anchor="middle" dominant-baseline="central">filter / levelOf</text>
  <text x="560" y="318" font-family="sans-serif" font-size="10" fill="#C4642F" text-anchor="middle" dominant-baseline="central">startTimeOf</text>
  <line x1="500" y1="290" x2="478" y2="290" stroke="#C4642F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="70" y="352" font-family="sans-serif" font-size="11" fill="#9C93E8">核心不出现具体模块名，模块特化由注册表注入</text>

  <line x1="340" y1="374" x2="340" y2="392" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="50" y="396" width="580" height="42" rx="8" fill="#17322A" stroke="#2E9A72" stroke-width="1"/>
  <text x="340" y="412" font-family="monospace" font-size="12" fill="#9FE1CB" text-anchor="middle" dominant-baseline="central">core/queue.ts</text>
  <text x="340" y="428" font-family="sans-serif" font-size="11" fill="#2E9A72" text-anchor="middle" dominant-baseline="central">lazyReport / debounceTime 合并</text>

  <line x1="340" y1="438" x2="340" y2="456" stroke="#2E9A72" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="50" y="460" width="580" height="82" rx="8" fill="#17322A" stroke="#2E9A72" stroke-width="1"/>
  <text x="340" y="478" font-family="monospace" font-size="12" fill="#9FE1CB" text-anchor="middle" dominant-baseline="central">core/transport.ts</text>
  <text x="340" y="496" font-family="sans-serif" font-size="11" fill="#2E9A72" text-anchor="middle" dominant-baseline="central">beacon / sendBeacon / fetch / XHR / image</text>
  <text x="340" y="514" font-family="sans-serif" font-size="11" fill="#2E9A72" text-anchor="middle" dominant-baseline="central">失败重试 · unload 兜底 · maxLogsPerPage 限流</text>

  <path d="M140 542 L140 578 L340 578" fill="none" stroke="#2E9A72" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M540 542 L540 578 L340 578" fill="none" stroke="#2E9A72" stroke-width="1.5"/>
  <text x="340" y="596" font-family="sans-serif" font-size="11" fill="#9FE1CB" text-anchor="middle">上报服务端（reportUrl / 自定义 request）</text>

  <text x="60" y="632" font-family="sans-serif" font-size="11" fill="#A9A7A0">旁路：breadcrumb.ts 在 error 发生时累积行为栈（click / input / route / console），挂在 ErrorData.breadcrumbs 上</text>
</svg>
