<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 692" width="100%">
  <title>monitor-report 数据流架构</title>
  <desc>三类采集入口经 normalize 后，必须通过 emitter.emit 接口闸门才能进入管道</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="692" fill="#1C1C1E"/>

  <text x="60" y="22" font-family="sans-serif" font-size="12" fill="#A9A7A0">采集层：三种入口，各自负责一类数据</text>

  <rect x="50" y="36" width="180" height="58" rx="8" fill="#232A38" stroke="#4E82B8" stroke-width="1"/>
  <text x="140" y="57" font-family="monospace" font-size="12" fill="#B8D4F0" text-anchor="middle" dominant-baseline="central">error</text>
  <text x="140" y="75" font-family="sans-serif" font-size="11" fill="#7FA8CC" text-anchor="middle" dominant-baseline="central">onerror / unhandledrejection</text>

  <rect x="250" y="36" width="180" height="58" rx="8" fill="#232A38" stroke="#4E82B8" stroke-width="1"/>
  <text x="340" y="57" font-family="monospace" font-size="12" fill="#B8D4F0" text-anchor="middle" dominant-baseline="central">network</text>
  <text x="340" y="75" font-family="sans-serif" font-size="11" fill="#7FA8CC" text-anchor="middle" dominant-baseline="central">fetch / XHR 替换</text>

  <rect x="450" y="36" width="180" height="58" rx="8" fill="#232A38" stroke="#4E82B8" stroke-width="1"/>
  <text x="540" y="57" font-family="monospace" font-size="12" fill="#B8D4F0" text-anchor="middle" dominant-baseline="central">performance</text>
  <text x="540" y="75" font-family="sans-serif" font-size="11" fill="#7FA8CC" text-anchor="middle" dominant-baseline="central">PerformanceObserver ×6 + rAF</text>

  <path d="M140 94 L140 118 L340 118" fill="none" stroke="#4E82B8" stroke-width="1.5"/>
  <path d="M340 94 L340 118" fill="none" stroke="#4E82B8" stroke-width="1.5"/>
  <path d="M540 94 L540 118 L340 118" fill="none" stroke="#4E82B8" stroke-width="1.5"/>
  <line x1="340" y1="118" x2="340" y2="136" stroke="#4E82B8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="50" y="140" width="580" height="42" rx="8" fill="#282542" stroke="#7F77DD" stroke-width="1"/>
  <text x="340" y="156" font-family="monospace" font-size="12" fill="#C9C3F2" text-anchor="middle" dominant-baseline="central">modules/*/normalize.ts</text>
  <text x="340" y="172" font-family="sans-serif" font-size="11" fill="#9C93E8" text-anchor="middle" dominant-baseline="central">各自标准化为 LogData（含指纹 / 去重键）</text>

  <line x1="340" y1="182" x2="340" y2="189" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="130" y="192" width="420" height="32" rx="8" fill="#332518" stroke="#BA7517" stroke-width="1"/>
  <text x="340" y="205" font-family="monospace" font-size="12" fill="#FAC775" text-anchor="middle" dominant-baseline="central">emitter.emit(type, data)</text>
  <text x="340" y="218" font-family="sans-serif" font-size="11" fill="#BA7517" text-anchor="middle" dominant-baseline="central">唯一通道 · 模块不能直接访问 queue / transport</text>

  <line x1="340" y1="224" x2="340" y2="237" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrowA)"/>

  <rect x="50" y="240" width="580" height="170" rx="12" fill="none" stroke="#7F77DD" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="70" y="260" font-family="monospace" font-size="12" fill="#C9C3F2">core/pipeline.ts</text>
  <text x="70" y="276" font-family="sans-serif" font-size="11" fill="#9C93E8">处理顺序固定，不得调整</text>

  <rect x="70" y="288" width="128" height="34" rx="6" fill="#282542" stroke="#7F77DD" stroke-width="1"/>
  <text x="134" y="305" font-family="sans-serif" font-size="11" fill="#C9C3F2" text-anchor="middle" dominant-baseline="central">① 校验</text>
  <rect x="206" y="288" width="128" height="34" rx="6" fill="#282542" stroke="#7F77DD" stroke-width="1"/>
  <text x="270" y="305" font-family="sans-serif" font-size="11" fill="#C9C3F2" text-anchor="middle" dominant-baseline="central">② 采样 sample</text>
  <rect x="342" y="288" width="128" height="34" rx="6" fill="#282542" stroke="#7F77DD" stroke-width="1"/>
  <text x="406" y="305" font-family="sans-serif" font-size="11" fill="#C9C3F2" text-anchor="middle" dominant-baseline="central">③ 去重 dedup</text>
  <rect x="70" y="330" width="128" height="34" rx="6" fill="#282542" stroke="#7F77DD" stroke-width="1"/>
  <text x="134" y="347" font-family="sans-serif" font-size="11" fill="#C9C3F2" text-anchor="middle" dominant-baseline="central">④ 脱敏 mask</text>
  <rect x="206" y="330" width="128" height="34" rx="6" fill="#282542" stroke="#7F77DD" stroke-width="1"/>
  <text x="270" y="347" font-family="sans-serif" font-size="11" fill="#C9C3F2" text-anchor="middle" dominant-baseline="central">⑤ 过滤 ignoreErrors</text>
  <rect x="342" y="330" width="128" height="34" rx="6" fill="#282542" stroke="#7F77DD" stroke-width="1"/>
  <text x="406" y="347" font-family="sans-serif" font-size="11" fill="#C9C3F2" text-anchor="middle" dominant-baseline="central">⑥ 计算 level</text>

  <rect x="500" y="288" width="120" height="76" rx="6" fill="#33201A" stroke="#C4642F" stroke-width="1"/>
  <text x="560" y="308" font-family="monospace" font-size="11" fill="#E8B392" text-anchor="middle" dominant-baseline="central">behaviors[type]</text>
  <text x="560" y="324" font-family="sans-serif" font-size="10" fill="#C4642F" text-anchor="middle" dominant-baseline="central">模块钩子</text>
  <text x="560" y="340" font-family="sans-serif" font-size="10" fill="#C4642F" text-anchor="middle" dominant-baseline="central">filter / levelOf</text>
  <text x="560" y="354" font-family="sans-serif" font-size="10" fill="#C4642F" text-anchor="middle" dominant-baseline="central">startTimeOf</text>
  <line x1="500" y1="326" x2="478" y2="326" stroke="#C4642F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="70" y="388" font-family="sans-serif" font-size="11" fill="#9C93E8">核心不出现具体模块名，模块特化由注册表注入</text>

  <line x1="340" y1="410" x2="340" y2="427" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="50" y="432" width="580" height="42" rx="8" fill="#17322A" stroke="#2E9A72" stroke-width="1"/>
  <text x="340" y="448" font-family="monospace" font-size="12" fill="#9FE1CB" text-anchor="middle" dominant-baseline="central">core/queue.ts</text>
  <text x="340" y="464" font-family="sans-serif" font-size="11" fill="#2E9A72" text-anchor="middle" dominant-baseline="central">lazyReport / debounceTime 合并</text>

  <line x1="340" y1="474" x2="340" y2="491" stroke="#2E9A72" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="50" y="496" width="580" height="82" rx="8" fill="#17322A" stroke="#2E9A72" stroke-width="1"/>
  <text x="340" y="514" font-family="monospace" font-size="12" fill="#9FE1CB" text-anchor="middle" dominant-baseline="central">core/transport.ts</text>
  <text x="340" y="532" font-family="sans-serif" font-size="11" fill="#2E9A72" text-anchor="middle" dominant-baseline="central">fetch POST · fetch keepalive → sendBeacon · Image 信标</text>
  <text x="340" y="550" font-family="sans-serif" font-size="11" fill="#2E9A72" text-anchor="middle" dominant-baseline="central">失败重试 · unload 兜底 · maxLogsPerPage 限流</text>

  <path d="M140 578 L140 610 L340 610" fill="none" stroke="#2E9A72" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M540 578 L540 610 L340 610" fill="none" stroke="#2E9A72" stroke-width="1.5"/>
  <text x="340" y="630" font-family="sans-serif" font-size="11" fill="#9FE1CB" text-anchor="middle">上报服务端（reportUrl / 自定义 request）</text>

  <text x="60" y="666" font-family="sans-serif" font-size="11" fill="#A9A7A0">旁路：breadcrumb.ts 在 error 发生时累积行为栈（click / input / route / console），挂在 ErrorData.breadcrumbs 上</text>
</svg>
