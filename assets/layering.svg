<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 530" width="100%">
  <title>monitor-report 分层架构</title>
  <desc>六层结构自上而下单向依赖：entries → modules → core → utils → constants → contracts</desc>
  <defs>
    <marker id="dn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A9A7A0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="up" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#C4642F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="530" fill="#1C1C1E"/>

  <text x="60" y="24" font-family="sans-serif" font-size="13" font-weight="500" fill="#EDEAE4">分层架构：依赖只朝下，反向 import 编译报错</text>

  <rect x="60" y="44" width="470" height="58" rx="10" fill="#22301B" stroke="#639922" stroke-width="1"/>
  <text x="80" y="65" font-family="monospace" font-size="13" font-weight="500" fill="#C0DD97" dominant-baseline="central">entries/</text>
  <text x="80" y="85" font-family="sans-serif" font-size="11" fill="#97C459" dominant-baseline="central">8 个子路径入口 · 只做模块组装</text>
  <text x="520" y="73" font-family="sans-serif" font-size="11" fill="#A9A7A0" dominant-baseline="central">不含业务逻辑</text>

  <line x1="200" y1="102" x2="200" y2="120" stroke="#A9A7A0" stroke-width="1.5" marker-end="url(#dn)"/>

  <rect x="60" y="124" width="470" height="58" rx="10" fill="#232A38" stroke="#4E82B8" stroke-width="1"/>
  <text x="80" y="145" font-family="monospace" font-size="13" font-weight="500" fill="#B8D4F0" dominant-baseline="central">modules/</text>
  <text x="80" y="165" font-family="sans-serif" font-size="11" fill="#7FA8CC" dominant-baseline="central">error · network · performance · memory · vue2 · vue3 · react</text>
  <text x="520" y="153" font-family="sans-serif" font-size="11" fill="#A9A7A0" dominant-baseline="central">不直接发请求</text>

  <line x1="200" y1="182" x2="200" y2="200" stroke="#A9A7A0" stroke-width="1.5" marker-end="url(#dn)"/>

  <rect x="60" y="204" width="470" height="58" rx="10" fill="#232A38" stroke="#4E82B8" stroke-width="1"/>
  <text x="80" y="225" font-family="monospace" font-size="13" font-weight="500" fill="#B8D4F0" dominant-baseline="central">core/</text>
  <text x="80" y="245" font-family="sans-serif" font-size="11" fill="#7FA8CC" dominant-baseline="central">LogReport · pipeline · queue · transport · config</text>
  <text x="520" y="233" font-family="sans-serif" font-size="11" fill="#A9A7A0" dominant-baseline="central">不出现模块名</text>

  <line x1="200" y1="262" x2="200" y2="280" stroke="#A9A7A0" stroke-width="1.5" marker-end="url(#dn)"/>

  <rect x="60" y="284" width="470" height="58" rx="10" fill="none" stroke="#8B8880" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="80" y="305" font-family="monospace" font-size="13" font-weight="500" fill="#EDEAE4" dominant-baseline="central">utils/</text>
  <text x="80" y="325" font-family="sans-serif" font-size="11" fill="#A9A7A0" dominant-baseline="central">time · mask · hash · debounce · once · never</text>
  <text x="520" y="313" font-family="sans-serif" font-size="11" fill="#A9A7A0" dominant-baseline="central">不持有状态</text>

  <line x1="200" y1="342" x2="200" y2="360" stroke="#A9A7A0" stroke-width="1.5" marker-end="url(#dn)"/>

  <rect x="60" y="364" width="470" height="58" rx="10" fill="none" stroke="#8B8880" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="80" y="385" font-family="monospace" font-size="13" font-weight="500" fill="#EDEAE4" dominant-baseline="central">constants/</text>
  <text x="80" y="405" font-family="sans-serif" font-size="11" fill="#A9A7A0" dominant-baseline="central">defaults · thresholds · version</text>
  <text x="520" y="393" font-family="sans-serif" font-size="11" fill="#A9A7A0" dominant-baseline="central">不含判断逻辑</text>

  <line x1="200" y1="422" x2="200" y2="440" stroke="#A9A7A0" stroke-width="1.5" marker-end="url(#dn)"/>

  <rect x="60" y="444" width="470" height="58" rx="10" fill="none" stroke="#8B8880" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="80" y="465" font-family="monospace" font-size="13" font-weight="500" fill="#EDEAE4" dominant-baseline="central">contracts/</text>
  <text x="80" y="485" font-family="sans-serif" font-size="11" fill="#A9A7A0" dominant-baseline="central">log.ts · config.ts · emitter.ts</text>
  <text x="520" y="473" font-family="sans-serif" font-size="11" fill="#A9A7A0" dominant-baseline="central">零运行时逻辑</text>

  <path d="M600 233 L600 152" fill="none" stroke="#C4642F" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#up)"/>
  <text x="608" y="195" font-family="sans-serif" font-size="11" fill="#C4642F">behaviors</text>
  <text x="608" y="210" font-family="sans-serif" font-size="11" fill="#C4642F">[type] 注入</text>

  <text x="60" y="520" font-family="sans-serif" font-size="11" fill="#A9A7A0">虚线框 = 纯声明 / 无状态；实线框 = 有运行时逻辑。实心箭头为依赖方向，红色虚线为模块钩子的反向注入</text>
</svg>
